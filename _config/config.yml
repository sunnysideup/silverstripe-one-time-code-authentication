---
name: OneTimeCodeAuthentication
After:
  - "#coresecurity"
---
SilverStripe\Security\Member:
  extensions:
    - Sunnysideup\OneTimeCode\MemberExtension

SilverStripe\Security\Security:
  extensions:
    - Sunnysideup\OneTimeCode\ControllerExtension

SilverStripe\Core\Injector\Injector:
  SilverStripe\Security\Security:
    properties:
      Authenticators:
        onetimecode: '%$Sunnysideup\OneTimeCode\OneTimeCodeAuthenticator'

  # used to limit how many codes can be requested from one IP address (see RequestLimiter)
  Psr\SimpleCache\CacheInterface.OneTimeCode:
    factory: SilverStripe\Core\Cache\CacheFactory
    constructor:
      namespace: "OneTimeCode"
